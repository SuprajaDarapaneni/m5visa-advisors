    <!-- Polyfill/Guard for window.fetch assignment in iframe/sandbox environments -->
    <script>
      (function() {
        try {
          var _origFetch = window.fetch;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch || _origFetch;
            },
            set: function(val) {
              _currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if property is already defined or redefinition restricted
        }
      })();
    </script>
